<!DOCTYPE html>
<html lang="pt-br">
    <head>

    <body>
            <h2>Utilizando o (em) no tamanho de font e espaçamento:</h2>
            <div class="caixa">
                <div class="caixa1-img">
                    <img 
                    src="./imagens/gatinho-miando.webp"
                    width="200"
                    />
                </div>
                
                <p class="texto2">Eu tenho 1.5em</p>
                <div class="texto3">Eu tenho 2em</div>
            </div>
            



            <h2>Utilizando o (rem)no tamanho de font e espaçamento:</h2>

            <div class="caixa">
                <p class="texto1-rem">Eu tenho 1rem</p>
            </div>


            <h2>Utilizando o (vh, vw) para largura e altura:</h2>

            <div class="caixa">

                <div class="container-vp">
                    <div class="barra1-vw">50vw</div>
                </div>

                <div class="container-vp">
                    <div class="barra2-vw">75vw</div>
                </div>
                
                <div class="container-vp">
                    <div class="barra3-vw">100vw</div>
                </div>

            </div>

           

        
            <div class="caixa1-vh">
               Altura: 30vh
               Largura: 50vw
            </div>
          

           


            <div class="test">
                exemplo
            </div>
