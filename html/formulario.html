<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Prática formulário</title>
    </head>
    <body>


   
        <form>
            <label for="nome"> Nome: </label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome"/>
            
            <br/>
            <br/>
            
            
            <label for="sobrenome">Sobrenome:</label>
            <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite seu sobrenome" />
            
            <br/>
            <br/>

            <label for="data_nasc">Data nascimento:</label>
            <input type="date" id="data_nasc" name="data_nasc"/>
            <br/>
            <br/>

            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" name="telefone" placeholder="Digite seu telefone"/>

            <br/>
            <br/>
      

            <label for="email">E-mail: </label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail"/>
            
            <br/>
            <br/>
            
            <label for="senha">Senha: </label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" />
            
            <br/>
            <br/>
            
            <label for="quantidade">Quantidade:</label>
            <input type="number" id="quantidade" name="quantidade" placeholder="Digite a quantidade" min="1" max="10"/>
            <br/>

            <h3>Genero:</h3>
            <input type="radio" id="feminino" name="genero" value="feminino" /> <label for="feminino">Feminino</label>
            
            <br/>
            <input type="radio" id="masculino" name="genero" value="masculino"  /> <label for="masculino">Masculino</label>
            
            <br/>
            <br/>

            <label>
               Escolha uma cor <input type="color" id="cor" name="cor"/> 
            </label>

            <br/>
            <br/>

            <label for="arquivo">
               Escolha um arquivo 
            </label>
            <input type="file" id="arquivo" name="arquivo"/>

            <br/>
            <br/>

            <label for="assunto">Assunto:</label>
            <select id="assunto" name="assunto">
                <option value="">--Escolha--</option>
                <option value="duvida">Dúvida</option>
                <option value="pedido">Pedido</option>
            </select>
            <br/>
            <br/>

            <label for="msg">Mensagem:</label> <br/>
            <textarea id="msg" cols="80" rows="5" ></textarea>
            <br/>
            <br/>
            <input type="submit" value="Enviar"/>  
        </form>


    </body>
</html>
